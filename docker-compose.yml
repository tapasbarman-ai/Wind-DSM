services:
  fastapi-server:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: wind-fastapi-server
    ports:
      - "8000:8000"
    volumes:
      # Mount code so local edits take effect without rebuilding
      - ./src:/app/src
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./config:/app/config
      - ./api.py:/app/api.py
      - ./main.py:/app/main.py
      # Mount the SQLite DB directly - no HTTP MLflow server needed!
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
    environment:
      # Point directly at the local SQLite file inside the container
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
